name: 功能建议
description: 提出解决具体使用问题的能力或体验改进。
title: "[建议] "
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: 内容和附件均公开，请使用虚构示例，不要提交个人资料、凭据、完整日志或内部配置。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到了什么使用问题
      description: 说明场景及影响，不包含个人账号信息。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望如何改进
      description: 描述期望的操作和结果，不要求给出技术实现。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 尝试过的替代方式（可选）
  - type: dropdown
    id: frequency
    attributes:
      label: 这个场景出现的频率
      options: [经常, 偶尔, 预计未来需要, 不确定]
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索相同建议，理解是否采纳和发布日期由维护者确认。
          required: true
        - label: 我确认正文和附件不含个人信息、真实凭据或内部配置，并理解内容将公开。
          required: true
